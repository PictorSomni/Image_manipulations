<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude">
<meta name="theme-color" content="#2C3038">
<title>Claude</title>
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
:root { --dark: #222429; --bg: #373d4a; --card: #2C3038; --grey: #9399A6;
  --text: #e6e8ee; --blue: #45B8F5; --orange: #FFA071; --red: #F17171;
  --green: #49B76C; --r: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; height: 100dvh; background: var(--card);
  color: var(--text); font: 16px -apple-system, system-ui, sans-serif; }
body { display: flex; flex-direction: column;
  padding-top: calc(32px + env(safe-area-inset-top)); }
.ms { font-family: "Material Symbols Rounded"; font-size: 1.25em;
  vertical-align: -.2em; font-weight: normal; }
header { display: grid; grid-template-columns: repeat(auto-fill,
  minmax(100px, 1fr)); gap: 6px; padding: 8px 12px; }
header button { min-height: 48px; padding: 6px; white-space: normal;
  font-size: 14px; }
#ctx { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--grey); }
#ctx .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--dark);
  overflow: hidden; }
#ctx .bar i { display: block; height: 100%; background: var(--green); }
main { flex: 1; overflow-y: auto; overflow-x: hidden; background: var(--bg); padding: 12px 16px; }
footer { display: flex; gap: 8px; padding: 8px 12px
  max(13px, calc(env(safe-area-inset-bottom) - 19px)); }
button { font: inherit; border: 0; border-radius: var(--r); color: var(--text);
  background: var(--dark); padding: 8px 12px; white-space: nowrap; }
button.go { background: var(--blue); color: var(--dark); }
button.warn { color: var(--red); }
textarea, input { font: inherit; color: var(--text); background: var(--dark);
  border: 1px solid #ffffff22; border-radius: var(--r); padding: 10px;
  box-sizing: border-box; width: 100%; }
textarea { resize: none; max-height: 40vh; }
.m { margin: 8px 0; padding: 10px 12px; border-radius: var(--r);
  white-space: pre-wrap; word-wrap: break-word; }
.user { background: #45B8F533; margin-left: 15%; }
.text { background: var(--card); }
.think { color: var(--grey); font-size: 14px; font-style: italic; }
.tool { color: var(--orange); font-size: 13px; font-family: ui-monospace,
  monospace; }
pre { font: 12px ui-monospace, monospace; white-space: pre-wrap;
  overflow-wrap: anywhere; overflow: hidden;
  background: var(--dark); padding: 10px; border-radius: var(--r); margin: 8px 0; }
#login { margin: 30vh auto 0; max-width: 260px; display: flex;
  flex-direction: column; gap: 10px; text-align: center; }
.hide { display: none !important; }
#upd { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
#upd button { color: var(--orange); font-size: 14px; }
#busy { padding: 6px 16px; font-size: 13px; color: var(--grey);
  background: var(--bg); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
#busy .bar { height: 3px; border-radius: 2px; background: var(--dark);
  overflow: hidden; margin-bottom: 5px; }
#busy .bar i { display: block; width: 30%; height: 100%;
  background: var(--blue); animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
/* Téléphone : boutons rangés dans un tiroir, ouvert par « Outils ». */
#drawer { display: none; }
@media (max-width: 700px) {
  #drawer { display: inline-block; }
  header:not(.open) > button { display: none; }
}
.ask { margin: 6px 0; }
.ask b { display: block; margin-bottom: 4px; }
.ask button, .tool > button { margin: 3px 4px 3px 0; padding: 6px 10px;
  border-radius: 8px; border: 1px solid #555; background: #2a2a2a;
  color: inherit; font: inherit; }
.ask button.on { background: #3b6; color: #000; }
</style>
</head>
<body>
<div id="login">
  <b><span class="ms">lock</span> Claude</b>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="go" onclick="login()">Entrer</button>
  <div id="err" style="color: var(--red)"></div>
</div>
<header class="hide">
  <div id="ctx"><span id="ctxt">Contexte : …</span>
    <div class="bar"><i id="ctxb" style="width: 0"></i></div>
    <button onclick="compact()"><span class="ms">compress</span> Compacter</button>
    <button id="drawer" onclick="drawer()"><span class="ms">menu</span></button></div>
  <div id="upd"></div>
  <button onclick="key('oui')"><span class="ms">check</span> Oui</button>
  <button onclick="key('non')"><span class="ms">close</span> Non</button>
  <button onclick="key('stop')"><span class="ms">stop</span> Stop</button>
  <button onclick="grill()"><span class="ms">lightbulb</span> Brainstorming</button>
  <button id="tts" onclick="toggleTts()"><span class="ms">volume_off</span> Lecture</button>
  <button onclick="notifs()"><span class="ms">notifications</span> Notifs</button>
  <button onclick="shell()"><span class="ms">terminal</span> Terminal</button>
  <button onclick="screen()"><span class="ms">monitor</span> Écran</button>
  <button onclick="act('bilan', 'Bilan du Pi')"><span class="ms">monitor_heart</span> Bilan</button>
  <button onclick="act('maj_pi', 'Mettre à jour le Pi')"><span class="ms">system_update</span> MAJ Pi</button>
  <button onclick="act('maj_claude', 'Mettre à jour Claude')"><span class="ms">upgrade</span> MAJ Claude</button>
  <button onclick="act('maj_hub', 'Mettre à jour Hub et relancer ses services')"><span class="ms">sync</span> MAJ Hub</button>
  <button onclick="act('relancer_claude', 'Relancer la session Claude')"><span class="ms">restart_alt</span> Relancer Claude</button>
  <button class="warn" onclick="act('reboot', 'Redémarrer le Pi')"><span class="ms">power_settings_new</span> Redémarrer</button>
</header>
<main class="hide" id="log"></main>
<div id="busy" class="hide"><div class="bar"><i></i></div><span></span></div>
<footer class="hide">
  <input id="files" type="file" multiple class="hide">
  <button onclick="$('files').click()"><span class="ms">attach_file</span></button>
  <textarea id="msg" rows="1"></textarea>
  <button class="go" onclick="send()"><span class="ms">send</span></button>
</footer>
<script>
let session = "", f = "", pos = null, timer = null;
try { session = localStorage.getItem("s") || ""; } catch (e) {}
const $ = id => document.getElementById(id);
const log = $("log");

async function call(path, body) {
  const r = await fetch(path, body === undefined ? {headers: {"X-Session": session}}
    : {method: "POST", body: JSON.stringify(body),
       headers: {"X-Session": session, "Content-Type": "application/json"}});
  if (r.status === 401) { show(false); throw new Error("PIN"); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

// App quittée : le Pi notifie dès maintenant, sans attendre.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && session) fetch("/hidden", {method: "POST",
    keepalive: true, body: "{}", headers: {"X-Session": session,
    "Content-Type": "application/json"}}).catch(() => {});
});

function show(on) {
  $("login").classList.toggle("hide", on);
  for (const el of document.querySelectorAll("header, main, footer"))
    el.classList.toggle("hide", !on);
  clearInterval(timer);
  if (on) { timer = setInterval(poll, 1500); poll(); }
}

async function login() {
  $("err").textContent = "";
  try {
    session = (await call("/login", {pin: $("pin").value})).session;
    try { localStorage.setItem("s", session); } catch (e) {}
    $("pin").value = "";
    show(true);
  } catch (e) { $("err").textContent = e.message; }
}

function add(cls, text) {
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const el = document.createElement(cls === "pre" ? "pre" : "div");
  el.className = cls === "pre" ? "" : "m " + cls;
  if (cls === "text")  // Markdown léger : gras et code
    el.innerHTML = text.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;",
      ">": "&gt;"})[c]).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  else el.textContent = text;
  log.append(el);
  if (near) log.scrollTop = log.scrollHeight;
  return el;
}

async function poll() {
  try {
    const d = await call(`/poll?f=${encodeURIComponent(f)}` +
      (pos === null ? "" : `&pos=${pos}`));
    if (d.f !== f && f) add("think", "— nouvelle conversation —");
    const live = pos !== null;  // pas de lecture de l'historique
    f = d.f; pos = d.pos;
    if (d.max) CTX_MAX = d.max;
    if (d.upd) upd(d.upd);
    if ("ask" in d) showAsk(d.ask);
    if ("busy" in d) {
      if (d.busy) sent = 0;
      busy(d.busy || (Date.now() - sent < 15000 ? "Envoi…" : ""));
    }
    for (const e of d.ev) {
      if (e.k === "user") add("user", e.t);
      else if (e.k === "text") { add("text", e.t); if (live) say(e.t); }
      else if (e.k === "think") add("think", e.t);
      else if (e.k === "tool") add("tool", e.t);
      else if (e.k === "ctx") ctx(e.n);
      else if (e.k === "end") sent = 0;
    }
  } catch (e) {}
}

let attached = [];
$("files").addEventListener("change", async () => {
  for (const file of $("files").files) {
    const note = add("tool", "Envoi de " + file.name + "…");
    try {
      const r = await fetch("/upload?n=" + encodeURIComponent(file.name),
        {method: "POST", body: file, headers: {"X-Session": session}});
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      attached.push(d.path);
      note.textContent = "Joint : " + d.path;
    } catch (e) { note.textContent = "Échec " + file.name + " : " + e.message; }
  }
  $("files").value = "";
});

async function send() {
  let t = $("msg").value.trim();
  if (!t && !attached.length) return;
  if (attached.length) {
    t = attached.map(p => `"${p}"`).join(" ") + (t ? " " + t : "");
    attached = [];
  }
  $("msg").value = ""; grow();
  sent = Date.now(); busy("Envoi…");
  try { await call("/send", {text: t}); } catch (e) { add("tool", e.message); }
}

// Questions à choix de Claude : un bouton par réponse (touche 1-9 dans
// le terminal), « Autre » pour du texte libre, puis « Valider » s'il y a
// plusieurs questions ou des choix multiples.
let askAt = null, askBox = null;
function showAsk(a) {
  if ((a && a.at) === askAt) return;
  askAt = a && a.at;
  if (askBox) { askBox.remove(); askBox = null; }
  if (a) askBox = ask(a.q, true);
}

function ask(qs, live) {
  const box = add("tool", "");
  box.textContent = "";
  qs.forEach(q => {
    const d = document.createElement("div");
    d.className = "ask";
    d.append(Object.assign(document.createElement("b"),
      {textContent: q.t}));
    [...q.o, "Autre…"].forEach((label, i) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.disabled = !live;
      b.onclick = async () => {
        let t = "";
        if (i === q.o.length && !(t = prompt(q.t))) return;
        await call("/key", {k: String(i + 1), t});
        if (!q.multi) d.querySelectorAll("button")
          .forEach(x => x.disabled = true);
        b.classList.add("on");
      };
      d.append(b);
    });
    box.append(d);
  });
  if (live && (qs.length > 1 || qs.some(q => q.multi))) {
    const v = document.createElement("button");
    v.textContent = "Valider";
    v.onclick = () => { key("entree"); v.disabled = true; };
    box.append(v);
  }
  return box;
}

async function key(k) {
  try { await call("/key", {k}); }
  catch (e) { add("tool", e.message); }
}

async function screen() {
  try { add("pre", (await call("/screen")).text); }
  catch (e) { add("tool", e.message); }
}

async function act(name, label) {
  if (!confirm(label + " ?")) return;
  try { await call("/action", {a: name}); }
  catch (e) { return add("tool", e.message); }
  const out = add("pre", label + "…");
  const tick = setInterval(async () => {
    try {
      const j = await call("/job");
      out.textContent = label + "\n" + j.out.slice(-4000);
      if (j.done) {
        clearInterval(tick);
        out.textContent += j.code === 0 ? "\n✔ Terminé" : `\n✘ Code ${j.code}`;
      }
    } catch (e) {}  // webapp relancée : on réessaie
  }, 1500);
}

// Claude au travail : barre animée + sa ligne d'activité (« Réflexion… »).
// Juste après un envoi, « Envoi… » couvre le temps que Claude démarre.
let sent = 0;
function busy(t) {
  $("busy").classList.toggle("hide", !t);
  $("busy").querySelector("span").textContent = t;
}

// Mises à jour en attente (vérifiées par le Pi) : un bouton chacune.
let updKey = "";
function upd(list) {
  if (JSON.stringify(list) === updKey) return;
  updKey = JSON.stringify(list);
  $("upd").replaceChildren(...list.map(([t, a]) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="ms">upgrade</span> MAJ ${t}`;
    b.onclick = () => act(a, a === "relancer_claude" ?
      "Relancer Claude pour finir sa mise à jour" : "Mettre à jour " + t);
    return b;
  }));
}

let CTX_MAX = 200000;  // seuil de compactage auto, envoyé par /poll
function ctx(n) {
  const p = Math.min(100, n * 100 / CTX_MAX);
  $("ctxt").textContent = `Contexte : ${Math.round(n / 1000)} k (${Math.round(p)} %)`;
  $("ctxb").style.width = p + "%";
  $("ctxb").style.background = p > 80 ? "var(--red)" : p > 50 ?
    "var(--orange)" : "var(--green)";
}

async function compact() {
  if (!confirm("Compacter la conversation ?")) return;
  try { await call("/send", {text: "/compact"}); }
  catch (e) { add("tool", e.message); }
}

function grill() {
  $("msg").value = "/grill-me " + $("msg").value; grow(); $("msg").focus();
}

// Lecture à voix haute des réponses (synthèse vocale du navigateur).
// La dictée, elle, passe par le micro du clavier iOS.
let tts = false;
try { tts = localStorage.getItem("tts") === "1"; } catch (e) {}
function say(t) {
  if (!tts) return;
  const u = new SpeechSynthesisUtterance(t.replace(/[*`#_>|]/g, ""));
  u.lang = "fr-FR";
  speechSynthesis.speak(u);
}
function drawTts() {
  $("tts").innerHTML = `<span class="ms">${tts ? "volume_up" :
    "volume_off"}</span> Lecture`;
  $("tts").classList.toggle("go", tts);
}
function toggleTts() {
  tts = !tts;
  try { localStorage.setItem("tts", tts ? "1" : "0"); } catch (e) {}
  speechSynthesis.cancel();
  if (tts) say("Lecture activée");  // iOS : 1er son lancé par un geste
  drawTts();
}
drawTts();
log.addEventListener("click", e => {  // toucher une réponse = la relire
  const m = e.target.closest(".text");
  if (m) { speechSynthesis.cancel(); const t = tts; tts = true;
    say(m.textContent); tts = t; }
});

// Notifications sur l'iPhone et la montre (page en HTTPS, ajoutée à
// l'écran d'accueil) : Claude a répondu, ou attend ton accord.
async function notifs() {
  if (!window.isSecureContext || !("serviceWorker" in navigator))
    return add("tool", "Notifications : ouvre la page en HTTPS " +
      "(https://pictorsomni.taild63b02.ts.net:10000) et ajoute-la à " +
      "l'écran d'accueil.");
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    if (await Notification.requestPermission() !== "granted")
      return add("tool", "Notifications refusées dans les réglages.");
    const key = (await call("/vapid")).key;
    const raw = Uint8Array.from(atob(key.replace(/-/g, "+")
      .replace(/_/g, "/")), c => c.charCodeAt(0));
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true,
      applicationServerKey: raw});
    await call("/subscribe", sub.toJSON());
    add("tool", "Notifications activées sur cet appareil.");
  } catch (e) { add("tool", "Notifications : " + e.message); }
}

// « ! commande » = exécutée dans le terminal du Pi par Claude Code.
function shell() {
  const m = $("msg");
  if (!m.value.startsWith("! ")) m.value = "! " + m.value;
  grow(); m.focus();
}

function drawer(open) {
  const hd = document.querySelector("header");
  hd.classList.toggle("open", open);
  $("drawer").firstChild.textContent = hd.classList.contains("open") ?
    "close" : "menu";
}
// Une action choisie referme le tiroir.
document.querySelector("header").addEventListener("click", e => {
  if (e.target.closest("header > button")) drawer(false);
});

function grow() {
  const m = $("msg");
  m.style.height = "auto";
  m.style.height = m.scrollHeight + "px";
}
$("msg").addEventListener("input", grow);
$("pin").addEventListener("keydown", e => e.key === "Enter" && login());
if (session) show(true);
</script>
</body>
</html>
