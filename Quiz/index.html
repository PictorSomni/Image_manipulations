<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz">
<meta name="theme-color" content="#1a1433">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<title>Quiz</title>
<style>
:root {
  --night: #1a1433; --deep: #241a4a; --card: #ffffff12; --line: #ffffff1f;
  --grey: #a9a3c9; --text: #f3f0ff; --violet: #9d6bff; --pink: #f471b7;
  --blue: #45b8f5; --green: #49d17c; --yellow: #ffcd4a; --red: #ff6b7d;
  --orange: #ffa071;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--night); }
body { min-height: 100vh; }
html, body { margin: 0; color: var(--text);
  font: 16px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
  background: linear-gradient(160deg, var(--deep), var(--night) 70%)
  fixed; }
/* Halos flous en fond, comme sur les écrans de jeu. */
body::before, body::after { content: ""; position: fixed; z-index: -1;
  width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(80px);
  opacity: .35; pointer-events: none; }
body::before { background: var(--violet); top: -25vmax; right: -20vmax; }
body::after { background: var(--pink); bottom: -30vmax; left: -25vmax;
  opacity: .22; }
main { max-width: 640px; margin: 0 auto; padding:
  calc(16px + env(safe-area-inset-top)) 16px
  calc(28px + env(safe-area-inset-bottom)); }
h1 { font-size: 34px; font-weight: 800; margin: 8px 0 2px;
  letter-spacing: -.02em; }
h1 span { background: linear-gradient(90deg, var(--yellow), var(--pink));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--grey); font-size: 14px; }
.label { color: var(--grey); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em; margin: 24px 0 8px; }
button { font: inherit; cursor: pointer; }
.seg { display: flex; background: #0003; border: 1px solid var(--line);
  border-radius: 14px; padding: 4px; }
.seg button { flex: 1; border: 0; background: none; color: var(--grey);
  padding: 10px; border-radius: 10px; font-size: 15px; font-weight: 600; }
.seg button.on { background: var(--violet); color: #fff;
  box-shadow: 0 4px 14px #9d6bff66; }
.modes { display: flex; gap: 12px; }
.modes button { flex: 1; border: 0; border-radius: 18px; padding: 22px 8px;
  font: inherit; font-size: 19px; font-weight: 800; color: #fff;
  opacity: .6; transform: scale(.94); transition: .15s; }
.modes .qcm { background: linear-gradient(135deg, #7b5cff, #e0559f);
  box-shadow: 0 6px 0 #4a2fa8; }
.modes .vf { background: linear-gradient(135deg, #2fae63, #2f9fd8);
  box-shadow: 0 6px 0 #1f6e7a; }
.modes button.on { opacity: 1; transform: none; outline: 3px solid #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card);
  color: var(--text); border-radius: 20px; padding: 7px 14px;
  font-size: 15px; }
.chip.on { background: var(--pink); border-color: var(--pink);
  color: #fff; font-weight: 600; box-shadow: 0 4px 14px #f471b755; }
/* Gros bouton de jeu : épais, ombre pleine dessous, s'enfonce au tap. */
.big { width: 100%; border: 0; border-radius: 16px; padding: 16px;
  font-size: 19px; font-weight: 800; letter-spacing: .02em;
  background: var(--yellow); color: #3a2400; margin-top: 24px;
  box-shadow: 0 6px 0 #c98f12, 0 10px 24px #ffcd4a44;
  transition: transform .08s, box-shadow .08s; }
.big:active { transform: translateY(4px);
  box-shadow: 0 2px 0 #c98f12, 0 4px 10px #ffcd4a33; }
.big:disabled { opacity: .5; }
.ghost { background: none; border: 0; color: var(--grey); padding: 12px; }
.card { background: var(--card); border: 1px solid var(--line);
  border-radius: 20px; padding: 16px; margin-top: 12px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  text-align: center; }
.stats .ico { font-size: 22px; }
.stats b { display: block; font-size: 26px; font-weight: 800; }
.top { display: flex; align-items: center; gap: 10px; }
.top .sp { flex: 1; }
.pill { background: #0003; border: 1px solid var(--line); border-radius: 20px;
  padding: 5px 12px; font-size: 13px; color: var(--grey); }
.score { font-size: 30px; font-weight: 800; color: var(--yellow); }
.score small { font-size: 14px; color: var(--grey); font-weight: 600; }
.bar { height: 10px; border-radius: 5px; background: #0004;
  margin: 12px 0 0; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--violet), var(--pink));
  transition: width .5s; }
.theme { color: var(--pink); font-size: 12px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .08em; }
.qcard { padding: 22px 18px; margin-top: 16px; }
.q { font-size: 22px; font-weight: 700; margin: 8px 0 0; line-height: 1.3; }
/* Réponses en tuiles 2×2 colorées. */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-top: 14px; }
.choice { position: relative; min-height: 96px; text-align: left;
  padding: 36px 12px 12px; border-radius: 18px; border: 0; color: #fff;
  font-size: 16px; font-weight: 600; line-height: 1.25;
  background: var(--c); box-shadow: 0 5px 0 #0005;
  transition: transform .08s, opacity .2s; }
.choice:active { transform: translateY(3px); }
.choice::before { content: attr(data-l); position: absolute; top: 10px;
  left: 12px; width: 22px; height: 22px; border-radius: 7px;
  background: #0003; font-size: 12px; font-weight: 800;
  display: grid; place-items: center; }
.choice:nth-child(1) { --c: #7b5cff; } .choice:nth-child(2) { --c: #e0559f; }
.choice:nth-child(3) { --c: #2f9fd8; } .choice:nth-child(4) { --c: #e58a3a; }
.grid.two .choice { min-height: 120px; font-size: 24px; font-weight: 800;
  text-align: center; padding: 12px; color: #1a1433; }
.grid.two .choice::before { display: none; }
.grid.two .choice:nth-child(1) { --c: #2fae63; }
.grid.two .choice:nth-child(2) { --c: #e0505f; }
.grid.done .choice { opacity: .35; transform: scale(.88);
  transition: transform .3s, opacity .3s; }
.grid .choice.good { --c: var(--green) !important; opacity: 1;
  box-shadow: 0 0 0 3px #fff, 0 0 30px #49d17c99;
  transform: scale(1.08); z-index: 1; animation: pop .35s ease-out; }
.grid .choice.bad { --c: var(--red) !important; opacity: 1;
  box-shadow: 0 0 0 3px #fff6, 0 0 24px #ff6b7d88;
  animation: shake .35s; }
.choice.gone { opacity: .15; }
@keyframes pop { 50% { transform: scale(1.16); } }
@keyframes shake { 25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); } }
.jokers { display: flex; gap: 10px; margin-top: 16px; }
.joker { flex: 1; border: 1px solid #ffcd4a66; background: #ffcd4a14;
  color: var(--yellow); border-radius: 14px; padding: 10px;
  font-size: 14px; font-weight: 700; }
.joker:disabled { opacity: .3; }
.hint { color: var(--yellow); margin-top: 12px; }
.explain { border-color: #45b8f566; }
.explain.ok { border-color: #49d17c88; background: #49d17c1c; }
.explain.ko { border-color: #ff6b7d88; background: #ff6b7d1c; }
.explain b { font-size: 18px; }
.wait { text-align: center; padding: 80px 0; color: var(--grey); }
.spin { width: 40px; height: 40px; margin: 0 auto 16px; border-radius: 50%;
  border: 4px solid #fff2; border-top-color: var(--pink);
  animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
.daily { width: 100%; text-align: left; color: var(--text);
  border-color: #ffcd4a88; background: linear-gradient(135deg,
  #ffcd4a22, #f471b71a); }
.learned { margin-top: 10px; }
.learned.ok { border-color: #49d17c66; }
.learned.ko { border-color: #ff6b7d66; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const $app = document.getElementById("app");
const S = {info: null, profile: localStorage.quizProfile || "Ensemble",
  theme: "Tout mélangé", kind: localStorage.quizKind || "qcm",
  level: +localStorage.quizLevel || 0, game: null};
const CORRECT_PER_LEVEL = 4;
const JOKERS = 3;

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(k));
  }
  return el;
}

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)} : {});
  const d = await r.json();
  if (d && d.error) throw new Error(d.error);
  return d;
}

function show(...kids) {
  $app.replaceChildren(...kids.filter(k => k != null && k !== false)); scrollTo(0, 0); }

// ── Accueil ──────────────────────────────────────────────────────────
async function home() {
  if (!S.info) {
    show(h("div", {class: "wait"}, h("div", {class: "spin"}), "Chargement…"));
    try { S.info = await api("/api/state"); }
    catch (e) { return show(h("div", {class: "wait"}, "Erreur : " +
      e.message)); }
  }
  const names = ["Aurélie", "Charles", S.info.team];
  if (!names.includes(S.profile)) S.profile = S.info.team;
  const p = S.info.profiles[S.profile] || {};
  const pick = (list, cur, set) => h("div", {class: "chips"},
    ...list.map(v => h("button", {class: "chip" + (v === cur ? " on" : ""),
      onclick: () => { set(v); home(); }}, v)));
  const custom = h("button", {class: "chip" +
    (S.info.themes.includes(S.theme) ? "" : " on"), onclick: () => {
      const t = (prompt("Thème", S.info.themes.includes(S.theme) ? "" :
        S.theme) || "").trim();
      if (t) { S.theme = t; home(); }
    }}, S.info.themes.includes(S.theme) ? "Autre…" : S.theme);
  show(
    h("h1", {}, h("span", {}, "Quiz")),
    h("div", {class: "muted"}, "Apprendre ensemble, une question à la fois"),
    h("div", {class: "label"}, "Qui joue"),
    h("div", {class: "seg"}, ...names.map(v => h("button",
      {class: v === S.profile ? "on" : "", onclick: () => {
        S.profile = v; localStorage.quizProfile = v; home(); }}, v))),
    h("div", {class: "card stats"},
      h("div", {}, h("div", {class: "ico"}, "⭐"), h("b", {}, p.points || 0),
        h("span", {class: "muted"}, "points")),
      h("div", {}, h("div", {class: "ico"}, "🎯"),
        h("b", {}, (p.good || 0) + (p.bad || 0) ?
        Math.round(100 * p.good / (p.good + p.bad)) + " %" : "–"),
        h("span", {class: "muted"}, "réussite")),
      h("div", {}, h("div", {class: "ico"}, "🔥"),
        h("b", {}, p.best_streak || 0), h("span",
        {class: "muted"}, "meilleure série"))),
    p.review ? h("div", {class: "muted", style: "margin-top:8px"},
      `${p.review} question${p.review > 1 ? "s" : ""} à réviser ` +
      "glissée" + (p.review > 1 ? "s" : "") + " dans la partie") : null,
    daily(),
    h("div", {class: "label"}, "Jeu"),
    h("div", {class: "modes"}, ...[["qcm", "Questions"], ["vf", "Vrai ou faux"]]
      .map(([k, t]) => h("button", {class: k + (k === S.kind ? " on" : ""),
        onclick: () => { S.kind = k; localStorage.quizKind = k; home(); }},
        t))),
    h("div", {class: "label"}, "Difficulté de départ"),
    h("div", {class: "chips"}, ...S.info.levels.map((t, i) => h("button",
      {class: "chip" + (i === S.level ? " on" : ""), onclick: () => {
        S.level = i; localStorage.quizLevel = i; home(); }}, t))),
    h("div", {class: "label"}, "Thème"),
    h("div", {class: "chips"}, [...pick(S.info.themes, S.theme,
      v => S.theme = v).children].concat(custom)),
    h("button", {class: "big", onclick: () => start()}, "Jouer"));
}

// ── Partie ───────────────────────────────────────────────────────────
// Question du jour : une seule question, puis retour à l'accueil.
function daily() {
  const d = S.info.daily;
  if (!d || localStorage.quizDaily === d.date) return null;
  return h("button", {class: "card daily", onclick: () => {
      start(true); S.game.queue = [d.q]; next(); }},
    h("div", {class: "theme", style: "color:var(--yellow)"},
      "☀️ Question du jour"),
    h("div", {style: "margin-top:4px"}, d.q.q));
}

function start(single) {
  S.game = {queue: [], level: single ? 3 : S.level, correct: 0, points: 0, streak: 0,
    best: 0, n: 0, half: JOKERS, hints: JOKERS, done: [], loading: null,
    asked: new Set(), single};
  if (single) return;
  fill();
  next();
}

// Lot suivant demandé en avance : la question d'après est déjà prête.
function fill() {
  const g = S.game;
  if (g.loading) return g.loading;
  g.loading = api("/api/questions", {profile: S.profile, theme: S.theme,
    level: g.level, kind: S.kind}).then(qs => { g.queue.push(...qs); })
    .finally(() => { g.loading = null; });
  return g.loading;
}

async function next() {
  const g = S.game;
  if (!g.queue.length) {
    show(h("div", {class: "wait"}, h("div", {class: "spin"}),
      "Claude prépare les questions…"));
    try { await fill(); }
    catch (e) {
      return show(h("div", {class: "wait"}, "Erreur : " + e.message,
        h("button", {class: "big", onclick: next}, "Réessayer"),
        h("button", {class: "ghost", onclick: finish}, "Terminer")));
    }
    if (S.game !== g) return;
    if (!g.queue.length) return next();
  }
  const q = g.queue.shift();
  if (g.asked.has(q.q)) return next();
  g.asked.add(q.q);
  if (g.queue.length < 4 && !g.single) fill().catch(() => {});
  ask(q);
}

function ask(q) {
  const g = S.game;
  g.n++;
  const hint = h("div", {class: "hint"});
  const buttons = q.choices.map((c, i) => h("button", {class: "choice",
    "data-l": "ABCD"[i], onclick: () => reply(q, i, buttons, jokers)}, c));
  const grid = h("div", {class: "grid" + (buttons.length < 4 ? " two" : "")},
    ...buttons);
  const half = h("button", {class: "joker",
    disabled: !g.half || q.choices.length < 4,
    onclick: () => {
      g.half--; half.disabled = true;
      buttons.map((b, i) => i).filter(i => i !== q.answer)
        .sort(() => Math.random() - .5).slice(0, 2)
        .forEach(i => { buttons[i].classList.add("gone");
          buttons[i].disabled = true; });
    }}, `50/50 · ${g.half}`);
  const help = h("button", {class: "joker", disabled: !g.hints || !q.hint,
    onclick: () => { g.hints--; help.disabled = true;
      hint.textContent = "💡 " + q.hint; }}, `Indice · ${g.hints}`);
  const jokers = h("div", {class: "jokers"}, half, help);
  const into = g.correct % CORRECT_PER_LEVEL;
  show(
    h("div", {class: "top"}, h("div", {class: "score"}, g.points,
      h("small", {}, " pts")), h("span", {class: "sp"}),
      g.streak > 1 ? h("span", {class: "pill"}, `🔥 ${g.streak}`) : null,
      h("span", {class: "pill"}, `Q${g.n} · ${S.info.levels[g.level]}`)),
    h("div", {class: "bar"}, h("i", {style:
      `width:${100 * into / CORRECT_PER_LEVEL}%`})),
    h("div", {class: "card qcard"},
      h("div", {class: "theme"}, (q.review ? "📚 Révision · " : "") +
        q.theme),
      h("div", {class: "q"}, q.q)),
    grid, jokers, hint);
}

function reply(q, i, buttons, jokers) {
  const g = S.game;
  const ok = i === q.answer;
  if (g.single) localStorage.quizDaily = S.info.daily.date;
  buttons[0].parentNode.classList.add("done");
  buttons.forEach((b, j) => { b.disabled = true;
    if (j === q.answer) b.classList.add("good");
    else if (j === i) b.classList.add("bad"); });
  jokers.remove();
  let up = false;
  if (ok) {
    g.points += 10 * (g.level + 1);
    g.streak++; g.best = Math.max(g.best, g.streak); g.correct++;
    if (g.correct % CORRECT_PER_LEVEL === 0 &&
        g.level < S.info.levels.length - 1) {
      g.level++; up = true;
      g.queue = g.queue.filter(x => x.review);  // niveau suivant
      fill().catch(() => {});
    }
  } else g.streak = 0;
  g.done.push({q, ok});
  api("/api/answer", {profile: S.profile, q, ok, streak: g.best,
    points: g.points}).then(d => S.info = d).catch(() => {});
  $app.append(
    h("div", {class: "card explain " + (ok ? "ok" : "ko")},
      h("b", {}, ok ? "🎉 Bravo !" : "Pas cette fois : " +
        q.choices[q.answer]),
      up ? h("div", {style: "color:var(--yellow);margin-top:4px"},
        "Niveau suivant : " + S.info.levels[g.level]) : null,
      h("div", {style: "margin-top:6px"}, q.explain)),
    ...g.single ? [] :
      [h("button", {class: "big", onclick: next}, "Question suivante")],
    h("button", {class: "ghost", style: "width:100%", onclick: finish},
      g.single ? "Terminer" : "Terminer la partie"));
  buttons[q.answer].scrollIntoView({behavior: "smooth", block: "start"});
}

async function finish() {
  const g = S.game;
  S.game = null;
  if (!g || !g.done.length) return home();
  api("/api/end", {profile: S.profile}).then(d => S.info = d)
    .catch(() => {});
  const good = g.done.filter(d => d.ok).length;
  show(
    h("h1", {}, "🏆 ", h("span", {}, `${g.points} points`)),
    h("div", {class: "muted"}, `${good} bonne${good > 1 ? "s" : ""} ` +
      `réponse${good > 1 ? "s" : ""} sur ${g.done.length} · meilleure ` +
      `série ${g.best} · niveau ${S.info.levels[g.level]}`),
    h("div", {class: "label"}, "Ce que vous avez appris"),
    ...g.done.map(({q, ok}) => h("div", {class: "card learned " +
      (ok ? "ok" : "ko")}, h("b", {}, q.q), h("div", {},
      q.choices[q.answer]), h("div", {class: "muted"}, q.explain))),
    h("button", {class: "big", onclick: home}, "Retour"));
}

home();
</script>
</body>
</html>
